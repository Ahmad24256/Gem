[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gem-agent"
version = "0.1.0"
description = "Terminal AI coding agent powered by OpenRouter (OpenAI-compatible API) with a tool-calling agent loop"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
gem = "gem.cli:app"

[tool.setuptools.packages.find]
include = ["gem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
